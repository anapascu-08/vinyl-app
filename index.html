<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinyl App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #14100f;
      color: #f2ede7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      text-align: center;
      max-width: 32rem;
    }

    .disc {
      width: 6rem;
      height: 6rem;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: radial-gradient(circle at center, #14100f 0.6rem, #2a211d 0.65rem, #2a211d 1.2rem, #14100f 1.25rem, #14100f 1.4rem, #3d302a 1.45rem, #3d302a 3rem);
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.02em;
      margin-bottom: 0.75rem;
    }

    p {
      color: #b5a99f;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <div class="disc"></div>
    <h1>Vinyl App</h1>
    <p>Gestionează-ți colecția de viniluri: adăugare, căutare, organizare și vizualizare.</p>
  </main>
</body>
</html>
